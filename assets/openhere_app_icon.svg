<stop offset="100%" stop-color="#8B3FE0"/>
</linearGradient>
<linearGradient id="folderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF"/>
<stop offset="100%" stop-color="#EDEBFB"/>
</linearGradient>

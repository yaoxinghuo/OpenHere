name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available schemes
        run: |
          xcodebuild -project OpenInNyaTerm.xcodeproj -list

      - name: Build Release
        run: |
          xcodebuild -project OpenInNyaTerm.xcodeproj \
                     -scheme OpenInNyaTerm \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=YES \
                     CODE_SIGNING_ALLOWED=YES \
                     build

      - name: Verify extension in app bundle
        run: |
          APP_PATH="build/Build/Products/Release/OpenInNyaTerm.app"
          echo "=== App bundle contents ==="
          find "$APP_PATH" -name "*.appex" -type d
          echo "=== PlugIns directory ==="
          ls -la "$APP_PATH/Contents/PlugIns/" 2>/dev/null || echo "No PlugIns directory found!"
          EXT_PATH="$APP_PATH/Contents/PlugIns/FinderSyncExtension.appex"
          if [ -d "$EXT_PATH" ]; then
            echo "=== Extension found ==="
            ls -la "$EXT_PATH/Contents/"
            echo "=== Extension Info.plist ==="
            plutil -p "$EXT_PATH/Contents/Info.plist"
            echo "=== Extension codesign info ==="
            codesign -dvvv "$EXT_PATH" 2>&1
            echo "=== Extension entitlements ==="
            codesign -d --entitlements - "$EXT_PATH" 2>&1
          else
            echo "ERROR: FinderSyncExtension.appex not found in app bundle!"
            exit 1
          fi

      - name: Re-sign with correct entitlements
        run: |
          APP_PATH="build/Build/Products/Release/OpenInNyaTerm.app"
          EXT_PATH="$APP_PATH/Contents/PlugIns/FinderSyncExtension.appex"
          echo "Re-signing extension with sandbox entitlements..."
          codesign --force --sign - --entitlements FinderSyncExtension/FinderSyncExtension.entitlements "$EXT_PATH"
          echo "Re-signing app..."
          codesign --force --sign - --entitlements OpenInNyaTerm/OpenInNyaTerm.entitlements "$APP_PATH"
          echo "Verifying signatures..."
          codesign --verify --verbose "$EXT_PATH" 2>&1
          codesign --verify --verbose "$APP_PATH" 2>&1
          echo "=== Final entitlements check ==="
          codesign -d --entitlements - "$EXT_PATH" 2>&1

      - name: Archive the app
        run: |
          cd build/Build/Products/Release
          tar czf OpenInNyaTerm.app.tar.gz OpenInNyaTerm.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenInNyaTerm.app
          path: build/Build/Products/Release/OpenInNyaTerm.app

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/OpenInNyaTerm.app.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available schemes
        run: |
          xcodebuild -project OpenInNyaTerm.xcodeproj -list

      - name: Build Release
        run: |
          xcodebuild -project OpenInNyaTerm.xcodeproj \
                     -scheme OpenInNyaTerm \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Zip the app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent OpenInNyaTerm.app OpenInNyaTerm.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenInNyaTerm-app
          path: build/Build/Products/Release/OpenInNyaTerm.app.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/OpenInNyaTerm.app.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
